<!doctype html>
<html lang="de"><meta charset="utf-8"><title>Klartext – lokales Einfüge-Testziel</title>
<style>body{font:18px system-ui;max-width:850px;margin:40px auto;background:#f3f6fa;color:#183140}textarea{width:100%;height:300px;font:20px system-ui;padding:15px;box-sizing:border-box}code{word-break:break-all}button{padding:10px;font:inherit}</style>
<h1>Klartext: lokales Testziel</h1><p>Nur Testtexte. Diese Datei verwendet kein Netzwerk.</p>
<label for="dictation">Hier mit Strg+V einfügen</label><textarea id="dictation" spellcheck="false"></textarea>
<p id="count">0 Zeichen</p><p>SHA-256 des UTF-8-Textes: <code id="hash">–</code></p>
<button id="save">Testtext lokal speichern</button>
<script>
const field=document.getElementById('dictation');field.addEventListener('input',async()=>{document.getElementById('count').textContent=field.value.length+' Zeichen';const bytes=new TextEncoder().encode(field.value);const digest=await crypto.subtle.digest('SHA-256',bytes);document.getElementById('hash').textContent=Array.from(new Uint8Array(digest),n=>n.toString(16).padStart(2,'0')).join('');});
document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([field.value],{type:'text/plain;charset=utf-8'}));a.download='Klartext-Browser-Test.txt';a.click();URL.revokeObjectURL(a.href);};
</script></html>
